name: Test UI CSS

on:
  # TEMP!!!! TODO: remove
  push:
    branches: [test/PKTS-222-ci-testing]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browsers:
        description: "Browsers to test"
        required: false
        default: "chromium"
        type: choice
        options:
          - chromium
          - all

# use the same Playwright image that generated the screenshot baselines
# pixel rendering must match exactly or comparisons will fail
env:
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

jobs:
  test:
    name: Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@8.15.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Determine browser filter
        id: browsers
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.browsers }}" = "all" ]; then
            echo "flag=" >> $GITHUB_OUTPUT
          else
            echo "flag=--project=chromium" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        working-directory: packages/ui-css
        run: pnpm exec playwright test ${{ steps.browsers.outputs.flag }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: packages/ui-css/blob-report/
          retention-days: 1

  merge-reports:
    name: Merge Reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@8.15.6 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: packages/ui-css/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        working-directory: packages/ui-css
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ui-css/playwright-report/
          retention-days: 7
